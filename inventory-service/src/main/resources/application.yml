spring:
  jpa:
    open-in-view: false
    hibernate:
      # fail at startup if the entities do not match the Flyway-managed schema
      ddl-auto: validate

ticketing:
  inventory:
    # How long tickets stay held while the user pays
    reservation-ttl: 10m
    # How often the cleanup runs that gives the tickets of unpaid, expired holds back to the stock (ISO-8601)
    expiry-sweep-interval: PT30S
